name: Destroy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to tear down the production infrastructure'
        required: true
        type: string
permissions:
  id-token: write  # required for OIDC authentication with AWS
  contents: read
jobs:
  destroy:
    name: Destroy AWS infrastructure
    runs-on: ubuntu-latest
    environment: production
    if: github.event.inputs.confirm == 'destroy'
    steps:
      - name: Abort if confirmation phrase is wrong
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "Confirmation phrase did not match 'destroy'. Aborting."
          exit 1

      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.11"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=chess-puzzle-generator/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform destroy
        working-directory: terraform
        run: terraform destroy -auto-approve
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
          TF_VAR_ec2_instance_type: ${{ vars.EC2_INSTANCE_TYPE }}
          TF_VAR_s3_bucket_name: ${{ secrets.S3_BUCKET_NAME }}
          TF_VAR_lambda_secret: ${{ secrets.LAMBDA_SECRET }}
          TF_VAR_app_repo_url: ${{ vars.APP_REPO_URL }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_puzzles_image_tag: ${{ github.sha }}
